name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android assets (offline WASM)
        run: npm run sync:android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/hwp-viewer.apk
          ls -lh dist/hwp-viewer.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hwp-viewer-apk
          path: dist/hwp-viewer.apk
          if-no-files-found: error

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/hwp-viewer.apk --clobber
          else
            gh release create "$TAG" dist/hwp-viewer.apk \
              --title "한글 뷰어 Android APK (최신)" \
              --notes "오프라인 @rhwp/core WASM 엔진이 포함된 안드로이드 설치 파일(APK)입니다. 안드로이드 기기에서 다운로드 후 설치하여 사용하세요."
          fi
