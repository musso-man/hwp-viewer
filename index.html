<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>한글 뷰어 — HWP · HWPX 뷰어 &amp; PDF 스캐너</title>
  <meta name="description" content="오프라인에서 HWP·HWPX 한글 문서를 열람·검색·PDF 저장하고, 문서를 촬영·보정해 PDF로 저장하는 뷰어 앱" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232563eb'/%3E%3Cstop offset='1' stop-color='%234f46e5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='sans-serif' font-weight='800' font-size='32' fill='%23ffffff'%3E%ED%95%9C%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- 상단 헤더 바 (필수 기능만 간결하게 배치) -->
    <header class="app-header">
      <div class="header-left">
        <a href="./" class="brand" id="brand-home" title="처음 화면">
          <span class="brand-badge" aria-hidden="true">한</span>
          <span class="brand-title">한글 뷰어</span>
        </a>
        <div class="engine-status is-loading" id="engine-status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="engine-status-text">엔진 준비 중...</span>
        </div>
      </div>

      <div class="header-actions">
        <button type="button" class="btn btn-primary" id="btn-open-file" title="문서 열기 (Ctrl+O)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          <span>열기</span>
        </button>

        <button type="button" class="btn btn-secondary" id="btn-open-scanner" title="문서 촬영 및 PDF 스캔">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
          <span>스캔</span>
        </button>

        <button type="button" class="btn btn-secondary doc-only hidden" id="btn-search-toggle" title="글자 검색 (Ctrl+F)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <span class="hide-sm">검색</span>
        </button>

        <button type="button" class="btn btn-secondary doc-only hidden" id="btn-save-pdf" title="PDF 파일로 저장">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>PDF</span>
        </button>

        <button type="button" class="btn btn-icon" id="btn-theme" title="라이트 / 다크 테마" aria-label="테마 전환">
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- 열린 문서 탭 바 -->
    <nav class="tab-bar hidden" id="tab-bar" aria-label="열린 문서 탭"></nav>

    <!-- 문서 제어 툴바 (페이지 이동 · 확대/축소) -->
    <div class="doc-toolbar hidden" id="doc-toolbar">
      <div class="toolbar-group">
        <button type="button" class="btn btn-icon" id="btn-sidebar-toggle" title="페이지 목록" aria-label="페이지 목록 토글">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
        </button>

        <div class="page-nav">
          <button type="button" class="btn btn-icon" id="btn-prev-page" title="이전 페이지" aria-label="이전 페이지">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <input type="number" id="page-input" class="page-input" min="1" value="1" aria-label="현재 페이지" />
          <span class="page-sep">/</span>
          <span id="page-total" class="page-total">1</span>
          <button type="button" class="btn btn-icon" id="btn-next-page" title="다음 페이지" aria-label="다음 페이지">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>
      </div>

      <div class="toolbar-group">
        <span class="col-badge hidden" id="col-badge" title="현재 한 줄에 표시되는 페이지 수">2단</span>
        <button type="button" class="btn btn-icon" id="btn-zoom-out" title="축소" aria-label="축소">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <select id="zoom-select" class="zoom-select" aria-label="확대 배율">
          <option value="fit-width">화면 맞춤</option>
          <option value="fit-page">한 페이지</option>
          <option value="0.25">25%</option>
          <option value="0.35">35%</option>
          <option value="0.5">50%</option>
          <option value="0.75">75%</option>
          <option value="1" selected>100%</option>
          <option value="1.25">125%</option>
          <option value="1.5">150%</option>
          <option value="2">200%</option>
        </select>
        <button type="button" class="btn btn-icon" id="btn-zoom-in" title="확대" aria-label="확대">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- 글자 검색 바 -->
    <div class="search-bar hidden" id="search-bar">
      <div class="search-input-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="문서 내 글자 검색..." autocomplete="off" />
        <span class="search-count" id="search-count">0 / 0</span>
      </div>
      <div class="search-nav-actions">
        <button type="button" class="btn btn-icon" id="btn-search-prev" title="이전 결과" aria-label="이전 검색 결과">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
          </svg>
        </button>
        <button type="button" class="btn btn-icon" id="btn-search-next" title="다음 결과" aria-label="다음 검색 결과">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <button type="button" class="btn btn-icon" id="btn-search-close" title="검색 닫기" aria-label="검색 닫기">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="search-results hidden" id="search-results"></div>
    </div>

    <!-- 메인 영역 -->
    <main class="main-area">
      <!-- 홈 화면: 직관적인 2가지 핵심 기능 카드 -->
      <section class="welcome-screen" id="welcome-screen">
        <div class="welcome-inner">
          <div class="welcome-hero">
            <h1>한글 문서 뷰어</h1>
            <p>오프라인으로 HWP · HWPX 문서를 바로 읽고 PDF로 저장하세요</p>
          </div>

          <div class="home-action-grid">
            <button type="button" class="home-card is-primary" id="welcome-dropzone">
              <div class="home-card-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                  <line x1="16" y1="13" x2="8" y2="13"></line>
                  <line x1="16" y1="17" x2="8" y2="17"></line>
                </svg>
              </div>
              <div class="home-card-body">
                <strong>한글 문서 열기</strong>
                <span>.hwp · .hwpx · 암호 문서 지원</span>
              </div>
            </button>

            <button type="button" class="home-card" id="btn-welcome-scanner">
              <div class="home-card-icon is-scan">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                  <circle cx="12" cy="13" r="4"></circle>
                </svg>
              </div>
              <div class="home-card-body">
                <strong>문서 스캔 → PDF</strong>
                <span>촬영 · 모서리/기울기 보정 · PDF 저장</span>
              </div>
            </button>
          </div>
        </div>
      </section>

      <!-- 문서 리더 영역 -->
      <section class="reader-layout hidden" id="reader-layout">
        <aside class="sidebar is-collapsed" id="sidebar" aria-label="페이지 썸네일">
          <div class="sidebar-header">
            <span>페이지 목록</span>
          </div>
          <div class="sidebar-body">
            <div class="sidebar-pane is-active" id="pane-thumbs"></div>
          </div>
        </aside>

        <div class="viewport" id="viewport" tabindex="0">
          <div class="pages-container" id="pages-container"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- 숨김 파일 입력 -->
  <input type="file" id="file-input" accept=".hwpx,.hwp,.hml" multiple hidden />
  <input type="file" id="scanner-camera-input" accept="image/*" capture="environment" hidden />
  <input type="file" id="scanner-gallery-input" accept="image/*" multiple hidden />

  <!-- 전체 창 드래그 앤 드롭 오버레이 -->
  <div class="drop-overlay hidden" id="drop-overlay">
    <div class="drop-overlay-box">
      <strong>여기에 한글 문서를 놓으세요</strong>
      <span>.hwpx · .hwp · .hml</span>
    </div>
  </div>

  <!-- 암호화 문서 비밀번호 입력 모달 -->
  <div class="modal-backdrop hidden" id="password-modal" role="dialog" aria-modal="true" aria-labelledby="pw-modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="pw-modal-title">암호화된 문서</h3>
        <button type="button" class="btn btn-icon" data-close-modal="password-modal" aria-label="닫기">×</button>
      </div>
      <form id="password-form" class="modal-body">
        <p class="modal-desc" id="password-filename">이 문서는 비밀번호로 보호되어 있습니다.</p>
        <input type="password" id="password-input" class="text-input" placeholder="문서 비밀번호 입력" required autocomplete="current-password" />
        <p class="form-error hidden" id="password-error"></p>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close-modal="password-modal">취소</button>
          <button type="submit" class="btn btn-primary">열기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 문서 스캔 → PDF 모달 -->
  <div class="modal-backdrop hidden" id="scanner-modal" role="dialog" aria-modal="true" aria-labelledby="scanner-modal-title">
    <div class="scanner-sheet">
      <div class="scanner-header">
        <div class="scanner-title-group">
          <h3 id="scanner-modal-title">문서 스캔</h3>
          <span class="scanner-badge" id="scanner-page-badge">0장</span>
        </div>
        <div class="scanner-header-actions">
          <button type="button" class="btn btn-primary" id="btn-scan-save-pdf" disabled>PDF 저장</button>
          <button type="button" class="btn btn-icon" data-close-modal="scanner-modal" aria-label="닫기">×</button>
        </div>
      </div>

      <!-- 스캔 초기 화면 -->
      <div class="scanner-empty" id="scanner-empty">
        <p>종이 문서를 촬영하거나 앨범에서 선택하면<br />모서리·기울기를 보정해 PDF로 저장합니다.</p>
        <div class="scanner-empty-actions">
          <button type="button" class="btn btn-primary btn-lg" id="btn-scan-camera">카메라로 촬영</button>
          <button type="button" class="btn btn-secondary btn-lg" id="btn-scan-gallery">앨범에서 선택</button>
        </div>
      </div>

      <!-- 스캔 편집 화면 -->
      <div class="scanner-editor hidden" id="scanner-editor">
        <div class="scanner-canvas-wrap">
          <canvas id="scanner-canvas"></canvas>
        </div>

        <div class="scanner-controls">
          <div class="scanner-row">
            <label class="tilt-label" for="scan-tilt-range">기울기</label>
            <input type="range" id="scan-tilt-range" min="-15" max="15" step="0.5" value="0" />
            <span class="tilt-val" id="scan-tilt-value">0.0°</span>
          </div>

          <div class="scanner-row scanner-btn-row">
            <button type="button" class="btn btn-secondary btn-sm" id="btn-scan-rot-left">↺ 90°</button>
            <button type="button" class="btn btn-secondary btn-sm" id="btn-scan-rot-right">↻ 90°</button>
            <button type="button" class="btn btn-secondary btn-sm" id="btn-scan-reset">초기화</button>
            <button type="button" class="btn btn-secondary btn-sm" id="btn-scan-preview">보정 미리보기</button>
            <button type="button" class="btn btn-secondary btn-sm is-danger" id="btn-scan-delete">삭제</button>
          </div>

          <div class="scanner-row scanner-btn-row">
            <button type="button" class="chip-btn" data-scan-filter="original">원본</button>
            <button type="button" class="chip-btn is-active" data-scan-filter="enhance">선명하게</button>
            <button type="button" class="chip-btn" data-scan-filter="bw">흑백 스캔</button>
            <span class="spacer"></span>
            <button type="button" class="btn btn-secondary btn-sm" id="btn-scan-add-camera">+ 촬영</button>
            <button type="button" class="btn btn-secondary btn-sm" id="btn-scan-add-gallery">+ 앨범</button>
          </div>

          <div class="scanner-pages-strip" id="scanner-pages-strip"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 토스트 알림 -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
